name: Test and release

# On every push and pull request: run the tests.
# On a push to main where manifest.json has a version without a release yet:
# create the tag and GitHub release, so HACS offers the update.
# Beta versions (e.g. 0.9.1b1) become pre-releases.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: python -m pytest -v

  release:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read version from manifest.json
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/weekaqua/manifest.json'))['version'])")
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version in manifest.json: $version"
      - name: Create release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released - nothing to do (bump the version in manifest.json to release)."
            exit 0
          fi
          # GitHub lists releases by name, character by character, and HACS takes
          # that order: "b10" would sort before "b2". Never publish a pre-release
          # number above 9 (use rc1..rc9, or the next patch version instead).
          if echo "$TAG" | grep -Eq '(a|b|rc)[0-9]{2,}$'; then
            echo "::error::$TAG has a two-digit pre-release number, which GitHub and HACS would sort wrongly. Use the next rc or patch version instead."
            exit 1
          fi
          # Release notes: this version's section of CHANGELOG.md + full changelog link
          python3 .github/release_notes.py "$VERSION" > notes.md
          prev=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          if [ -n "$prev" ]; then
            printf '\n\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$REPO" "$prev" "$TAG" >> notes.md
          else
            printf '\n\n**Full changelog**: https://github.com/%s/commits/%s\n' "$REPO" "$TAG" >> notes.md
          fi
          cat notes.md
          # Versions like 0.9.1b1 / 0.9.1a1 / 0.9.1rc1 are betas: published as
          # pre-releases, which HACS only offers with "Show beta versions".
          if echo "$TAG" | grep -Eq '(a|b|rc)[0-9]+$'; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG (beta)" --notes-file notes.md --prerelease
            echo "Released $TAG as a pre-release (beta)"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
            echo "Released $TAG"
          fi
